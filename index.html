<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem('aquacore-color-scheme');
        if (theme === 'light' || theme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = theme;
          document.documentElement.dataset.theme = theme;
        }
      } catch { /* Follow the system when site storage is unavailable. */ }
    </script>
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="AquaCore 海洋之心 — Northeastern University's student underwater robotics team. Explore our vehicles, competitions, and community." />
    <title>AquaCore NEU</title>
  </head>
  <body class="">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
