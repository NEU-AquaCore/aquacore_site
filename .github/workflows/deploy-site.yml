name: Deploy AquaCore website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquacore-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'NEU-AquaCore/aquacore_site' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the published revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Verify deployment archive handling
        run: |
          python3 -m unittest discover -s deploy/tests -v
          bash -n deploy/activate-release.sh deploy/github-receive-release.sh deploy/github-activate-release.sh deploy/configure-github-deploy.sh

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Record the GitHub revision
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/_deployment.json", JSON.stringify({ commit: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY, builtAt: new Date().toISOString() }) + "\n");'

      - name: Prepare an incremental release
        run: |
          if ! curl --connect-timeout 15 --max-time 30 -fsS https://aquacore.org.cn/_asset-manifest.json -o "$RUNNER_TEMP/aquacore-previous-manifest.json"; then
            printf '{"version":1,"files":{}}\n' > "$RUNNER_TEMP/aquacore-previous-manifest.json"
          fi
          python3 deploy/prepare_release.py package dist "$RUNNER_TEMP/aquacore-previous-manifest.json" "$RUNNER_TEMP/aquacore-site.tar.gz"

      - name: Publish the verified release
        env:
          DEPLOY_HOST: ${{ secrets.AQUACORE_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.AQUACORE_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.AQUACORE_DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.AQUACORE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.AQUACORE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_PORT:?}" "${DEPLOY_SSH_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}"
          key_file="$RUNNER_TEMP/aquacore-deploy-key"
          hosts_file="$RUNNER_TEMP/aquacore-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          digest="$(sha256sum "$RUNNER_TEMP/aquacore-site.tar.gz" | cut -d ' ' -f 1)"
          ssh -i "$key_file" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $digest" < "$RUNNER_TEMP/aquacore-site.tar.gz"

      - name: Verify the public website
        run: |
          curl --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 30 -fsS https://aquacore.org.cn/_deployment.json -o "$RUNNER_TEMP/aquacore-deployment.json"
          python3 -c 'import json, os; data = json.load(open(os.environ["RUNNER_TEMP"] + "/aquacore-deployment.json")); assert data["commit"] == os.environ["GITHUB_SHA"], data'
          curl --connect-timeout 15 --max-time 30 -fsS https://aquacore.org.cn/team -o /dev/null
          curl --connect-timeout 15 --max-time 30 -fsS https://www.aquacore.org.cn/ -o /dev/null
          printf 'Published `%s` to [AquaCore](https://aquacore.org.cn/).\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
