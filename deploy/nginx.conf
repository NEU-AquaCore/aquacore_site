server {
    listen 80;
    listen [::]:80;
    server_name aquacore.org.cn www.aquacore.org.cn;

    root /var/www/aquacore/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    include /etc/nginx/snippets/aquacore-security.conf;

    access_log /var/log/nginx/aquacore.access.log;
    error_log /var/log/nginx/aquacore.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml model/gltf+json;

    # Revalidate mutable public files and HTML after each deployment.
    expires -1;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        expires off;
        try_files $uri =404;
    }

    # Only Vite's content-addressed assets get a permanent cache.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/aquacore-security.conf;
    }

    # There is no contact API in this static project. Never return HTML as API success.
    location ^~ /api/ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    # Missing game/model/script files must be 404, rather than the SPA HTML.
    location ~* \.(?:html?|js|mjs|css|json|map|glb|gltf|bin|wasm|png|jpe?g|webp|gif|svg|ico|avif|mp3|ogg|wav|mp4|webm|pdf|woff2?|ttf|txt|xml|zip)$ {
        try_files $uri =404;
    }

    # React Router paths, including /game, must survive a direct visit or refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
